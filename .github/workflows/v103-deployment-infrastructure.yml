name: V10.3 Infrastructure Audit

on:
  push:
    branches:
      - v10.3-deployment-infrastructure
    paths:
      - '.gitignore'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - 'src/worker.js'
      - 'scripts/**'
      - '.github/workflows/v103-deployment-infrastructure.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v103-infrastructure-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: 2b6a604bc92bef14dd8fcb5b8e90dbac883676e0

    steps:
      - name: Checkout exact audit commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require isolated V10.3 branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v10.3-deployment-infrastructure"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD

      - name: Reject application or sealed-source modifications
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$SOURCE_SHA"...HEAD | tee /tmp/v103-infra-files.txt
          unexpected="$(grep -Ev '^(\.gitignore|package\.json|package-lock\.json|wrangler\.jsonc|src/worker\.js|scripts/prepare-v103\.mjs|scripts/verify-v103\.mjs|\.github/workflows/v103-deployment-infrastructure\.yml|\.github/workflows/verify-v103-sealed-portal\.yml|\.github/workflows/deploy-v103-cloudflare-preview\.yml)$' /tmp/v103-infra-files.txt || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected non-infrastructure changes detected:' >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git diff --quiet "$SOURCE_SHA" HEAD -- verification/v10.3 README-FIRST.txt app.js config.js index.html manifest.webmanifest service-worker.js styles.css vercel.json

      - name: Require committed dependency lock
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json
          node -e "const l=require('./package-lock.json'); if(l.packages['node_modules/wrangler'].version!=='4.125.0') process.exit(1); console.log('Locked wrangler',l.packages['node_modules/wrangler'].version)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exactly from lockfile
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Run integrity and Wrangler dry-run audit
        shell: bash
        run: npm test

      - name: Prove push workflows cannot create Cloudflare versions
        shell: bash
        run: |
          set -euo pipefail
          for f in .github/workflows/v103-deployment-infrastructure.yml .github/workflows/verify-v103-sealed-portal.yml; do
            test -f "$f"
            if grep -Eiq 'wrangler[[:space:]]+(deploy|versions[[:space:]]+upload)|npm[[:space:]]+run[[:space:]]+(deploy|deploy:preview)' "$f"; then
              echo "Deployment command found in push-triggered workflow: $f" >&2
              exit 1
            fi
          done

      - name: Prove deployment workflow is manual-only
        shell: bash
        run: |
          set -euo pipefail
          deploy=.github/workflows/deploy-v103-cloudflare-preview.yml
          test -f "$deploy"
          grep -q '^  workflow_dispatch:' "$deploy"
          if grep -Eq '^  (push|pull_request|schedule|workflow_run):' "$deploy"; then
            echo 'Automatic trigger found in deployment workflow' >&2
            exit 1
          fi

      - name: Re-audit working tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --porcelain --untracked-files=no | wc -l)" -eq 0
          echo 'V10.3 infrastructure audit: GREEN'
